name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            suffix: .exe
            format: zip
          - name: linux-amd64
            goos: linux
            goarch: amd64
            suffix: ""
            format: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test backend
        env:
          CGO_ENABLED: 0
        run: go test ./...

      - name: Build backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p "release/kianshu-${{ matrix.name }}"
          go build -trimpath -ldflags="-s -w" \
            -o "release/kianshu-${{ matrix.name }}/kianshu${{ matrix.suffix }}" \
            ./cmd/server

      - name: Package
        env:
          PACKAGE_NAME: kianshu-${{ matrix.name }}
        run: |
          cp -r web/dist "release/$PACKAGE_NAME/web-dist"
          cp README.md "release/$PACKAGE_NAME/"
          if [ "${{ matrix.format }}" = "zip" ]; then
            (cd release && zip -r "../$PACKAGE_NAME.zip" "$PACKAGE_NAME")
          else
            tar -czf "$PACKAGE_NAME.tar.gz" -C release "$PACKAGE_NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kianshu-${{ matrix.name }}
          path: |
            kianshu-*.zip
            kianshu-*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
