  /test-sets/{id}/members/{userID}:
    delete:
      description: 将指定用户从测试集成员中移除。仅 owner 可管理成员。
      parameters:
      - description: 测试集 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 要移除的用户 ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已移除
          schema:
            $ref: '#/definitions/httpapi.okResp'
        "400":
          description: 无效的 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 仅 owner 可管理成员
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 移除成员
      tags:
      - 测试集
  /test-sets/{id}/units:
    get:
      description: 按测试集列出测试单元,支持 tag / method / 关键字(q,匹配 name、path、slug)过滤;include_deleted=true
        时包含已软删单元。需要读权限。
      parameters:
      - description: 测试集 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 按 tag 过滤
        in: query
        name: tag
        type: string
      - description: 按请求方法过滤(GET/POST/...)
        in: query
        name: method
        type: string
      - description: 关键字,匹配名称/路径/slug
        in: query
        name: q
        type: string
      - description: 是否包含已软删单元,默认 false
        in: query
        name: include_deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 测试单元列表
          schema:
            $ref: '#/definitions/httpapi.unitListResp'
        "400":
          description: 无效的测试集 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无权访问该测试集
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 查询失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 查询测试单元
      tags:
      - 测试单元
  /test-sets/{id}/units/{unitID}:
    delete:
      description: 软删除指定测试单元;历史版本引用的接口信息不受影响。需要编辑权限。
      parameters:
      - description: 测试集 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 测试单元 ID
        in: path
        name: unitID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            $ref: '#/definitions/httpapi.okResp'
        "400":
          description: 无效的 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无编辑权限
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "404":
          description: 单元不存在
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 删除测试单元(软删)
      tags:
      - 测试单元
    get:
      description: 返回单个测试单元的完整信息(含请求/响应/安全契约的原始 JSON)。需要读权限。
      parameters:
      - description: 测试集 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 测试单元 ID
        in: path
        name: unitID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 测试单元
          schema:
            $ref: '#/definitions/model.TestUnit'
        "400":
          description: 无效的 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无权访问该测试集
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "404":
          description: 单元不存在
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 获取测试单元
      tags:
      - 测试单元
  /test-sets/{id}/units/tool-list:
    get:
      description: 供 LLM agent 工具使用的精简单元列表,最多 500 条,不含软删单元。支持 tag / 关键字 q 过滤。
      parameters:
      - description: 测试集 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 按 tag 过滤
        in: query
        name: tag
        type: string
      - description: 关键字,匹配名称/路径/slug
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 精简单元列表
          schema:
            $ref: '#/definitions/httpapi.unitBriefListResp'
        "400":
          description: 无效的测试集 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无权访问该测试集
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 查询失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 查询测试单元(工具精简版)
      tags:
      - 测试单元
securityDefinitions:
  BearerAuth:
    description: '登录后获得的会话令牌,请求时以 `Authorization: Bearer <token>` 形式携带。'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
