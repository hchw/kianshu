basePath: /api
definitions:
  flow.Level:
    enum:
    - error
    - warning
    type: string
    x-enum-varnames:
    - LevelError
    - LevelWarning
  flow.Result:
    properties:
      errors:
        items:
          $ref: '#/definitions/flow.ValidationError'
        type: array
      warnings:
        items:
          $ref: '#/definitions/flow.ValidationError'
        type: array
    type: object
  flow.ValidationError:
    properties:
      code:
        type: string
      expected_format:
        type: string
      level:
        $ref: '#/definitions/flow.Level'
      message:
        type: string
      node_id:
        type: string
    type: object
  httpapi.RegisterReq:
    properties:
      password:
        example: "123456"
        minLength: 6
        type: string
      username:
        example: testuser
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  httpapi.addMemberReq:
    properties:
      role:
        example: edit
        type: string
      user_id:
        example: 2
        type: integer
    required:
    - role
    - user_id
    type: object
  httpapi.agentNewResp:
    properties:
      ok:
        example: true
        type: boolean
      session_id:
        example: 1
        type: integer
    type: object
  httpapi.agentResumeReq:
    properties:
      answers:
        items:
          $ref: '#/definitions/service.PauseAnswer'
        type: array
      provider_id:
        example: 1
        type: integer
      thinking:
        example: high
        type: string
    required:
    - answers
    - provider_id
    type: object
  httpapi.agentSessionView:
    properties:
      messages:
        items: {}
        type: array
      pending_questions:
        items:
          $ref: '#/definitions/service.PauseQuestion'
        type: array
      status:
        example: active
        type: string
    type: object
  httpapi.agentSubmitReq:
    properties:
      instruction:
        example: 请为用户登录接口生成测试流
        minLength: 1
        type: string
      mode:
        example: edit
        type: string
      provider_id:
        example: 1
        type: integer
      selected_nodes:
        example:
        - '["get-users-{id}"]'
        items:
          type: string
        type: array
      system_prompt:
        example: 本流对接 XX 云签名规范
        type: string
      thinking:
        example: high
        type: string
    required:
    - instruction
    - provider_id
    type: object
  httpapi.createFlowReq:
    properties:
      name:
        example: 我的测试流
        minLength: 1
        type: string
    required:
    - name
    type: object
  httpapi.createScheduleReq:
    properties:
      cron:
        example: 0 */2 * * *
        minLength: 1
        type: string
    required:
    - cron
    type: object
  httpapi.createTestSetReq:
    properties:
      host:
        example: https://api.example.com
        type: string
      name:
        example: 我的测试集
        minLength: 1
        type: string
    required:
    - name
    type: object
  httpapi.cronDescribeResp:
    properties:
      description:
        type: string
      next_runs:
        items:
          type: string
        type: array
      valid:
        type: boolean
    type: object
  httpapi.deletedResp:
    properties:
      deleted:
        example: true
        type: boolean
    type: object
  httpapi.draftView:
    properties:
      flow_id:
        example: 1
        type: integer
      name:
        example: 我的测试流
        type: string
      tree:
        example: '{"root":{}}'
        type: string
    type: object
  httpapi.duplicateFlowReq:
    properties:
      name:
        example: 我的测试流 副本
        type: string
    type: object
  httpapi.errorResp:
    properties:
      error:
        example: 参数不合法
        type: string
    type: object
  httpapi.flowListResp:
    properties:
      flows:
        items:
          $ref: '#/definitions/model.TestFlow'
        type: array
    type: object
  httpapi.importConfirmResp:
    properties:
      error:
        example: 文档非标准
        type: string
      issues:
        example:
        - '["缺少 info.title"]'
        items:
          type: string
        type: array
      need_confirmation:
        example: true
        type: boolean
    type: object
  httpapi.importReq:
    properties:
      confirm:
        example: true
        type: boolean
      content:
        type: object
      source:
        example: my-api
        type: string
    required:
    - content
    type: object
  httpapi.loginResp:
    properties:
      id:
        example: 1
        type: integer
      token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      username:
        example: testuser
        type: string
    type: object
  httpapi.memberListResp:
    properties:
      members:
        items:
          $ref: '#/definitions/httpapi.memberView'
        type: array
      owner:
        $ref: '#/definitions/httpapi.memberView'
    type: object
  httpapi.memberView:
    properties:
      role:
        example: edit
        type: string
      user_id:
        example: 2
        type: integer
      username:
        example: zhangsan
        type: string
    type: object
  httpapi.okResp:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  httpapi.providerListResp:
    properties:
      providers:
        items:
          $ref: '#/definitions/httpapi.providerView'
        type: array
    type: object
  httpapi.providerReq:
    properties:
      api_key:
        example: sk-xxx
        type: string
      base_url:
        example: https://api.openai.com
        format: uri
        minLength: 1
        type: string
      enabled:
        example: true
        type: boolean
      model:
        example: gpt-4
        type: string
      name:
        example: 我的 OpenAI
        minLength: 1
        type: string
      strict_content:
        description: StrictContent 为 true 时,client 把 null content 改为空串,兼容 ollama/vLLM。
        example: false
        type: boolean
    required:
    - base_url
    - name
    type: object
  httpapi.providerTestResp:
    properties:
      error:
        example: 连接超时
        type: string
      ok:
        example: true
        type: boolean
    type: object
  httpapi.providerView:
    properties:
      base_url:
        example: https://api.openai.com
        type: string
      enabled:
        example: true
        type: boolean
      id:
        example: 1
        type: integer
      model:
        example: gpt-4
        type: string
      name:
        example: 我的 OpenAI
        type: string
      strict_content:
        example: false
        type: boolean
    type: object
  httpapi.refreshResp:
    properties:
      expires_at:
        description: 新令牌过期时间
        example: "2025-01-01T00:00:00Z"
        type: string
      token:
        description: 新签发的令牌
        example: 6f2b0c9de4a51f8c...
        type: string
    type: object
  httpapi.registerResp:
    properties:
      id:
        example: 1
        type: integer
      username:
        example: testuser
        type: string
    type: object
  httpapi.renameFlowReq:
    properties:
      name:
        example: 支付流程
        minLength: 1
        type: string
    required:
    - name
    type: object
  httpapi.runListResp:
    properties:
      runs:
        items:
          $ref: '#/definitions/model.ExecutionLog'
        type: array
    type: object
  httpapi.scheduleListResp:
    properties:
      schedules:
        items:
          $ref: '#/definitions/model.FlowSchedule'
        type: array
    type: object
  httpapi.setScheduleEnabledReq:
    properties:
      enabled:
        example: true
        type: boolean
    type: object
  httpapi.signResp:
    properties:
      nonce:
        description: 请求携带的 nonce(原样回显)
        example: abc123
        type: string
      ok:
        example: true
        type: boolean
      timestamp:
        description: 请求携带的时间戳(原样回显)
        example: 1730000000
        type: integer
    type: object
  httpapi.testSetListResp:
    properties:
      test_sets:
        items:
          $ref: '#/definitions/model.TestSet'
        type: array
    type: object
  httpapi.unitBrief:
    properties:
      id:
        example: 1
        type: integer
      method:
        example: GET
        type: string
      name:
        example: 获取用户
        type: string
      path:
        example: /users/{id}
        type: string
      security:
        example: '[{"BearerAuth":[]}]'
        type: string
      slug:
        example: get-users-{id}
        type: string
      tag:
        example: 用户
        type: string
    type: object
  httpapi.unitBriefListResp:
    properties:
      units:
        items:
          $ref: '#/definitions/httpapi.unitBrief'
        type: array
    type: object
  httpapi.unitListResp:
    properties:
      units:
        items:
          $ref: '#/definitions/model.TestUnit'
        type: array
    type: object
  httpapi.updateDraftReq:
    properties:
      name:
        example: 我的测试流
        type: string
      tree: {}
    required:
    - tree
    type: object
  httpapi.updateTestSetReq:
    properties:
      host:
        example: https://new-api.example.com
        type: string
      name:
        example: 新名称
        type: string
    type: object
  httpapi.userBrief:
    properties:
      id:
        example: 2
        type: integer
      username:
        example: zhangsan
        type: string
    type: object
  httpapi.userSearchResp:
    properties:
      users:
        items:
          $ref: '#/definitions/httpapi.userBrief'
        type: array
    type: object
  httpapi.versionListResp:
    properties:
      versions:
        items:
          $ref: '#/definitions/model.FlowVersion'
        type: array
    type: object
  model.ExecutionLog:
    properties:
      created_at:
        type: string
      finished_at:
        type: string
      flow_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      node_results:
        type: string
      started_at:
        type: string
      status:
        example: success
        type: string
      tree:
        type: string
      version_id:
        example: 1
        type: integer
      version_no:
        example: 1
        type: integer
    type: object
  model.FlowDraft:
    properties:
      created_at:
        type: string
      flow_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: 我的测试流
        type: string
      system_prompt:
        type: string
      thinking:
        type: string
      tree:
        type: string
      updated_at:
        type: string
    type: object
  model.FlowSchedule:
    properties:
      created_at:
        type: string
      cron:
        example: 0 */2 * * *
        type: string
      enabled:
        example: true
        type: boolean
      flow_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      job_id:
        example: job_abc123
        type: string
      test_set_id:
        example: 1
        type: integer
      updated_at:
        type: string
    type: object
  model.FlowVersion:
    properties:
      created_at:
        type: string
      created_by:
        example: 1
        type: integer
      enabled:
        example: true
        type: boolean
      flow_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      system_prompt:
        type: string
      tree:
        type: string
      version_no:
        example: 1
        type: integer
    type: object
  model.TestFlow:
    properties:
      created_at:
        type: string
      created_by:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: 我的测试流
        type: string
      test_set_id:
        example: 1
        type: integer
      updated_at:
        type: string
    type: object
  model.TestSet:
    properties:
      created_at:
        type: string
      host:
        example: https://api.example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 我的测试集
        type: string
      owner_id:
        example: 1
        type: integer
      updated_at:
        type: string
    type: object
  model.TestSetMember:
    properties:
      created_at:
        type: string
      id:
        example: 1
        type: integer
      role:
        example: edit
        type: string
      test_set_id:
        example: 1
        type: integer
      user_id:
        example: 2
        type: integer
    type: object
  model.TestUnit:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        example: 1
        type: integer
      import_id:
        example: 1
        type: integer
      method:
        example: GET
        type: string
      name:
        example: 获取用户
        type: string
      params:
        type: string
      path:
        example: /users/{id}
        type: string
      request_body:
        type: string
      responses:
        type: string
      security:
        type: string
      slug:
        example: get-users-{id}
        type: string
      spec:
        type: string
      tag:
        example: 用户
        type: string
      test_set_id:
        example: 1
        type: integer
      updated_at:
        type: string
    type: object
  service.AgentResult:
    properties:
      can_enable:
        type: boolean
      events:
        items:
          $ref: '#/definitions/service.Event'
        type: array
      final_valid:
        type: boolean
      finished:
        type: boolean
      limit_reached:
        type: boolean
      message:
        type: string
      rounds:
        type: integer
    type: object
  service.Event:
    properties:
      args: {}
      kind:
        description: '"round" | "text" | "tool"(默认)'
        type: string
      result: {}
      round:
        type: integer
      text:
        description: Text is the incremental assistant content for kind=text events.
        type: string
      tool:
        type: string
    type: object
  service.ImportResult:
    properties:
      created:
        type: integer
      importID:
        type: integer
      updated:
        type: integer
    type: object
  service.PauseAnswer:
    properties:
      answer:
        type: string
      question_id:
        type: string
    type: object
  service.PauseQuestion:
    properties:
      id:
        type: string
      node_id:
        type: string
      node_type:
        type: string
      operation:
        type: string
      options:
        items:
          type: string
        type: array
      question:
        type: string
      tool_args:
        description: JSON-encoded tool call args for replay
        type: string
      tool_call_id:
        description: LLM tool call id for tool-result correlation
        type: string
      type:
        description: auth | sample | order | swagger | scope | limit
        type: string
    type: object
info:
  contact: {}
  description: 导入 Swagger/OpenAPI 文档生成测试单元；LLM 生成可编辑的树形测试流；支持试运行、不可变版本快照与定时调度。
  title: 鉴枢 Kianshu API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: '校验用户名与密码,成功后签发会话令牌。令牌需在后续请求中通过 `Authorization: Bearer <token>`
        携带。'
      parameters:
      - description: 登录凭据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功,返回 token
          schema:
            $ref: '#/definitions/httpapi.loginResp'
        "400":
          description: 请求体不合法
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 使当前会话令牌立即失效。
      produces:
      - application/json
      responses:
        "200":
          description: 已退出
          schema:
            $ref: '#/definitions/httpapi.okResp'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: '使用当前请求携带的有效会话令牌换取一个新令牌并延长会话有效期,旧令牌随即失效。需携带 `Authorization: Bearer
        <token>`。'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功,返回新令牌
          schema:
            $ref: '#/definitions/httpapi.refreshResp'
        "401":
          description: 未登录或会话已失效
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 签发新令牌失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 刷新令牌
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 使用用户名与密码注册新账号。用户名至少 3 字符,密码至少 6 字符,用户名全局唯一。
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.RegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: 注册成功
          schema:
            $ref: '#/definitions/httpapi.registerResp'
        "400":
          description: 参数不合法 / 用户名已存在
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      summary: 注册账号
      tags:
      - 认证
  /flow/flows/{flowID}:
    delete:
      description: 硬删除指定测试流及其草稿、版本、运行记录与定时调度,并取消已注册的定时任务。需要编辑权限。
      parameters:
      - description: 流 ID
        in: path
        name: flowID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            $ref: '#/definitions/httpapi.deletedResp'
        "400":
          description: 无效的流 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无编辑权限
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "404":
          description: 流不存在
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 删除失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 删除测试流
      tags:
      - 测试流
    patch:
      consumes:
      - application/json
      description: 重命名指定测试流,同步更新流记录与草稿记录中的名称,保证列表与编辑器标题一致。需要编辑权限。
      parameters:
      - description: 流 ID
        in: path
        name: flowID
        required: true
        type: integer
      - description: 新名称
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.renameFlowReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的测试流
          schema:
            $ref: '#/definitions/model.TestFlow'
        "400":
          description: 名称不能为空 / 名称过长 / 请求体不合法
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无编辑权限
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "404":
          description: 流不存在
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 重命名失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 重命名测试流
      tags:
      - 测试流
  /flow/flows/{flowID}/agent/compress:
    post:
      description: 压缩流的 LLM 会话历史,保留系统提示、操作摘要和最后一条用户消息,去除冗余的工具调用/结果以节省 token。需要编辑权限。
      parameters:
      - description: 流 ID
        in: path
        name: flowID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 压缩完成
          schema:
            $ref: '#/definitions/httpapi.agentNewResp'
        "400":
          description: 无效的流 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无编辑权限
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 压缩会话失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 压缩 Agent 会话历史
      tags:
      - LLM Agent
  /flow/flows/{flowID}/agent/new:
    post:
      description: 清空流的 LLM 会话历史,开启全新会话。需要编辑权限。
      parameters:
      - description: 流 ID
        in: path
        name: flowID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 新会话 ID
          schema:
            $ref: '#/definitions/httpapi.agentNewResp'
        "400":
          description: 无效的流 ID
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "403":
          description: 无编辑权限
          schema:
            $ref: '#/definitions/httpapi.errorResp'
        "500":
          description: 重置会话失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
      summary: 重置 Agent 会话
      tags:
      - LLM Agent
  /flow/flows/{flowID}/agent/resume:
    post:
      consumes:
      - application/json
      description: 当生成流程在冲突/暂停点停下时,提交对暂停问题的回答以继续。需要编辑权限。
      parameters:
      - description: 流 ID
        in: path
        name: flowID
        required: true
        type: integer
      - description: provider_id 与 answers 必填
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.agentResumeReq'
