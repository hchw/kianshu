  /utils/sign:
    post:
      consumes:
      - application/json
      description: 登录后携带 X-Timestamp / X-Nonce / X-Signature 请求头;签名中间件用共享密钥(KS_SIGN_SECRET)对
        METHOD、path、query、body、timestamp、nonce 组成的规范串计算 HMAC-SHA256 并校验,通过后返回成功。用于外部联调签名算法。
      parameters:
      - description: Unix 秒级时间戳
        format: int64
        in: header
        name: X-Timestamp
        required: true
        type: integer
      - description: 随机串,防重放
        in: header
        name: X-Nonce
        required: true
        type: string
      - description: hex HMAC-SHA256 签名
        in: header
        name: X-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 签名校验通过
          schema:
            $ref: '#/definitions/httpapi.signResp'
        "401":
          description: 签名缺失 / 时间戳超差 / nonce 重放 / 校验失败
          schema:
            $ref: '#/definitions/httpapi.errorResp'
      security:
      - BearerAuth: []
